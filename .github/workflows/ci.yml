# CI: בכל push / pull request -> מוודאים שכל אימג' של Docker נבנה בהצלחה,
# ואז מריצים את כל הסביבה עם docker compose ובודקים אותה (כולל שמירת המידע ב-Redis).
name: CI - Docker Build                      # שם ה-workflow כפי שיופיע בלשונית Actions

on:                                          # מתי ה-workflow רץ
  push:                                      # בכל push
    branches: ["**"]                         # לכל branch שהוא
  pull_request:                              # ובכל pull request

jobs:                                        # רשימת המשימות (jobs)
  build:                                     # משימה 1: בניית האימג'ים
    name: Build ${{ matrix.service }} image  # שם המשימה - משתנה לפי השירות מה-matrix
    runs-on: ubuntu-latest                   # רץ על מכונה וירטואלית של Ubuntu ש-GitHub מספק
    strategy:                                # אסטרטגיית הרצה
      matrix:                                # matrix = מריצים את אותה משימה כמה פעמים במקביל
        service: [api, web]                  # פעם אחת לשירות api ופעם אחת לשירות web
    steps:                                   # השלבים של המשימה
      - name: Checkout code                  # שלב: הורדת הקוד מה-repo
        uses: actions/checkout@v4            # action רשמי שמוריד את הקוד למכונה

      - name: Set up Docker Buildx           # שלב: הכנת Buildx (בונה מתקדם של Docker)
        uses: docker/setup-buildx-action@v3  # action רשמי של Docker להתקנת Buildx

      - name: Build image (no push)          # שלב: בניית האימג' בלי להעלות אותו
        uses: docker/build-push-action@v6    # action רשמי של Docker לבנייה (ודחיפה)
        with:                                # פרמטרים ל-action
          context: ./${{ matrix.service }}   # תיקיית הבנייה - api או web לפי ה-matrix
          push: false                        # לא מעלים לשום registry - רק בודקים שהבנייה עובדת
          tags: smart-parking-${{ matrix.service }}:ci   # תגית לאימג' שנבנה
          cache-from: type=gha,scope=${{ matrix.service }}          # קוראים שכבות מה-cache של GitHub Actions
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}   # שומרים את כל השכבות ל-cache לריצה הבאה

  compose-test:                              # משימה 2: בדיקת עשן לכל הסביבה
    name: Docker Compose smoke test          # שם המשימה
    runs-on: ubuntu-latest                   # רץ על מכונת Ubuntu
    needs: build                             # רץ רק אחרי שמשימת build הצליחה
    steps:                                   # השלבים של המשימה
      - name: Checkout code                  # שלב: הורדת הקוד
        uses: actions/checkout@v4            # action רשמי להורדת הקוד

      - name: Start the stack and wait for healthchecks   # שלב: הרמת כל השירותים
        run: docker compose up -d --build --wait          # בונה, מריץ ברקע ומחכה שכל השירותים יהיו healthy

      - name: Test API through Nginx         # שלב: בדיקת ה-API דרך ה-Nginx
        run: |                               # כמה פקודות shell ברצף
          # בדיקת בריאות - נכשל אם התשובה אינה 2xx
          curl -fsS http://localhost:8080/api/health
          # מדמים מצלמה ששולחת POST עם מספר רישוי חדש
          curl -fsS -X POST -H "Content-Type: application/json" \
               -d '{"plate":"12-345-67"}' http://localhost:8080/api/cars
          # מוודאים שהרכב מופיע ברשימת הרכבים בחניון
          curl -fsS http://localhost:8080/api/cars | grep "12-345-67"
          # מוודאים שעמוד לוח הבקרה עצמו נטען ומכיל את המילה parking
          curl -fsS http://localhost:8080/ | grep -i "parking"

      - name: Restart stack and verify data persisted in the volume   # שלב: בדיקה שהמידע נשמר
        run: |                               # כמה פקודות shell ברצף
          docker compose down          # עוצרים ומוחקים קונטיינרים; בלי -v -> ה-volume נשאר
          docker compose up -d --wait  # מרימים הכל מחדש ומחכים שיהיה healthy
          curl -fsS http://localhost:8080/api/cars | grep "12-345-67"   # הרכב עדיין שם = המידע שרד
          echo "✅ data survived docker compose down/up"                # הודעת הצלחה ללוג

      - name: Show logs on failure           # שלב: הצגת לוגים לדיבאג
        if: failure()                        # רץ רק אם שלב קודם נכשל
        run: docker compose logs             # מדפיס את הלוגים של כל הקונטיינרים

      - name: Cleanup                        # שלב: ניקוי
        if: always()                         # רץ תמיד - גם בהצלחה וגם בכישלון
        run: docker compose down -v          # מוחק קונטיינרים, רשתות וגם את ה-volumes
