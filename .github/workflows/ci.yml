# CI: on every push / pull request -> make sure every Docker image builds,
# then run the whole stack with docker compose and test it (including Redis persistence).
name: CI - Docker Build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    name: Build ${{ matrix.service }} image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, web]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false
          tags: smart-parking-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  compose-test:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start the stack and wait for healthchecks
        run: docker compose up -d --build --wait

      - name: Test API through Nginx
        run: |
          curl -fsS http://localhost:8080/api/health
          curl -fsS -X POST -H "Content-Type: application/json" \
               -d '{"plate":"12-345-67"}' http://localhost:8080/api/cars
          curl -fsS http://localhost:8080/api/cars | grep "12-345-67"
          curl -fsS http://localhost:8080/ | grep -i "parking"

      - name: Restart stack and verify data persisted in the volume
        run: |
          docker compose down          # no -v -> the volume stays
          docker compose up -d --wait
          curl -fsS http://localhost:8080/api/cars | grep "12-345-67"
          echo "✅ data survived docker compose down/up"

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Cleanup
        if: always()
        run: docker compose down -v
