# קובץ ההגדרות של Nginx עבור קונטיינר לוח הבקרה
server {                                   # הגדרת "שרת וירטואלי" אחד
    listen 80;                             # מאזין לפורט 80 (HTTP) בתוך הקונטיינר
    server_name _;                         # "_" = מקבל בקשות לכל שם דומיין

    root /usr/share/nginx/html;            # התיקייה שממנה מוגשים הקבצים הסטטיים
    index index.html;                      # הקובץ שמוגש כשמבקשים תיקייה (למשל "/")

    # קבצי לוח הבקרה הסטטיים (HTML / CSS / JS)
    location / {                           # כל בקשה שלא תפסה location ספציפי יותר
        try_files $uri $uri/ /index.html;  # מנסה קובץ, אחר כך תיקייה, ואם לא קיים - מחזיר index.html
    }                                      # סוף ה-location של הקבצים הסטטיים

    # Reverse proxy: כל בקשה ל-/api/... מועברת לשירות "api".
    # "api" הוא שם השירות ב-docker-compose -> ה-DNS הפנימי של Docker מתרגם אותו לכתובת הקונטיינר.
    # היתרון: הדפדפן מדבר עם מקור (origin) אחד בלבד (אין בעיית CORS), ופורט ה-API לא חשוף החוצה.
    location /api/ {                                                   # כל נתיב שמתחיל ב-/api/
        proxy_pass http://api:3000;                                    # מעביר את הבקשה לקונטיינר ה-api בפורט 3000
        proxy_set_header Host $host;                                   # מעביר הלאה את ה-Host המקורי שהדפדפן שלח
        proxy_set_header X-Real-IP $remote_addr;                       # מעביר את כתובת ה-IP האמיתית של הלקוח
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # מוסיף את ה-IP לשרשרת ה-proxy-ים
    }                                                                  # סוף ה-location של ה-API

    # נתיב בדיקת בריאות קטן עבור קונטיינר ה-web עצמו
    location = /healthz {                  # התאמה מדויקת לנתיב /healthz בלבד
        access_log off;                    # לא כותבים ללוג כל בדיקת בריאות (כדי לא להציף אותו)
        return 200 "ok\n";                 # מחזירים מיד 200 עם הטקסט ok
    }                                      # סוף ה-location של healthz
}                                          # סוף הגדרת השרת
