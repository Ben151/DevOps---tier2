# Nginx config for the dashboard container
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # static dashboard files (HTML / CSS / JS)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy: every request to /api/... goes to the "api" service.
    # "api" is the service name in docker-compose -> Docker's internal DNS resolves it.
    # Benefit: browser talks to ONE origin (no CORS), and the API port is not exposed.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # small health endpoint for the web container itself
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
